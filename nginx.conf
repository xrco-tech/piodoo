# ---------------------------------------------------------------------------
# Static marketing site — xrco.tech landing page.
# Served for the apex + www only; everything else falls through to the
# default_server block below (Odoo: piodoo.xrco.tech and any other host).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name xrco.tech www.xrco.tech;

    root /var/www/xrco;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Odoo (piodoo) — default_server catch-all so piodoo.xrco.tech and any
# unmatched Host still reach the app exactly as before.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # Allow large POST bodies — call recordings (comm_dialer / comm_whatsapp_calling)
    # are uploaded as multipart bodies that can exceed nginx's 1M default.
    client_max_body_size 64M;

    # Docker's internal DNS — resolves service names dynamically
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffers 16 64k;
    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;

    location /websocket {
        set $upstream_lp odoo:8072;
        proxy_pass http://$upstream_lp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /longpolling {
        set $upstream_lp odoo:8072;
        proxy_pass http://$upstream_lp;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $upstream_odoo odoo:8069;
        proxy_pass http://$upstream_odoo;
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
        proxy_connect_timeout 30s;
    }
}
