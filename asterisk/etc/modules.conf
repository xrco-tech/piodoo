[modules]
autoload=yes
; Preload the HTTP websocket layer that the PJSIP wss transport rides on.
preload=res_http_websocket.so
; chan_sip (deprecated) grabs the "sip" websocket subprotocol first, which makes
; res_pjsip_transport_websocket decline to load. We use PJSIP only — unload chan_sip
; so the wss transport can register.
noload=chan_sip.so
