;=============================================================================
; pjsip.conf — Vox SIP trunk (PSTN) + WebRTC agent softphones
; Placeholders like ${VOX_SIP_HOST} are substituted from .env at container
; start (see docker-compose.asterisk.yml entrypoint). Confirm the auth mode
; (registration vs IP) and codecs with Vox.
;=============================================================================

;--- Transports --------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}
local_net=${LOCAL_NET}

; WebRTC transport for agent browser softphones (SIP-over-WSS).
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

;=============================================================================
; VOX TRUNK (outbound PSTN)
;=============================================================================
[vox]
type=endpoint
context=from-vox
disallow=all
allow=${VOX_CODECS}
outbound_auth=vox_auth
aors=vox_aor
from_user=${VOX_USERNAME}
from_domain=${VOX_SIP_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[vox_auth]
type=auth
auth_type=userpass
username=${VOX_USERNAME}
password=${VOX_SECRET}

[vox_aor]
type=aor
contact=sip:${VOX_SIP_HOST}:${VOX_SIP_PORT}
qualify_frequency=60

; Registration — comment out this block if Vox uses IP-based auth instead.
[vox_reg]
type=registration
outbound_auth=vox_auth
server_uri=sip:${VOX_SIP_HOST}:${VOX_SIP_PORT}
client_uri=sip:${VOX_USERNAME}@${VOX_SIP_HOST}
retry_interval=60
forbidden_retry_interval=300

; Match inbound calls from Vox to the [vox] endpoint.
[vox_identify]
type=identify
endpoint=vox
match=${VOX_SIP_HOST}

;=============================================================================
; WEBRTC AGENT TEMPLATE
; Provision one endpoint per agent (or auto-provision from res.users). Each
; agent's browser registers with these credentials over WSS. The ARI bridge
; service dials PJSIP/<agent> to add them to a bridge.
;=============================================================================
[agent-tpl](!)
type=endpoint
context=from-agents
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
transport=transport-wss
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes

; --- Example agent 1001 (replace / generate per agent) ---------------------
[1001](agent-tpl)
auth=1001_auth
aors=1001
[1001_auth](auth-tpl)
username=1001
password=CHANGE_ME_AGENT_1001
[1001](aor-tpl)
