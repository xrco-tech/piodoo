;=============================================================================
; extensions.conf — dialplan for the dialer
;
; The ARI bridge service originates the CUSTOMER leg straight into Stasis, so
; most control lives in the service. These contexts cover:
;   from-vox     inbound legs from Vox (and the AMD pre-step if you originate
;                via dialplan rather than pure-ARI AMD)
;   dialer-out   an optional dialplan origination target that runs AMD then
;                hands the channel to Stasis(comm_dialer)
;   from-agents  agent WebRTC endpoints (bridged in by the service)
;=============================================================================

[globals]
STASIS_APP=comm_dialer

;--- Outbound customer leg with AMD, then into Stasis ------------------------
; Originate to: Local/<number>@dialer-out  (or PJSIP/<number>@vox directly from
; ARI and run AMD over ARI instead). Using Local+AMD here keeps AMD in dialplan.
[dialer-out]
exten => _X.,1,NoOp(Dialer outbound to ${EXTEN})
 same => n,AMD()                              ; sets AMDSTATUS = HUMAN/MACHINE/NOTSURE
 same => n,NoOp(AMD result = ${AMDSTATUS})
 same => n,Stasis(${STASIS_APP},outbound,${AMDSTATUS})
 same => n,Hangup()

;--- Inbound from Vox (future: inbound campaigns / callbacks) ----------------
[from-vox]
exten => _X.,1,NoOp(Inbound from Vox to ${EXTEN})
 same => n,Stasis(${STASIS_APP},inbound)
 same => n,Hangup()

;--- Agents (bridged in by the service; keep a safety hangup) ----------------
[from-agents]
exten => _X.,1,NoOp(Agent ${CALLERID(num)} dialing ${EXTEN})
 same => n,Stasis(${STASIS_APP},agent)
 same => n,Hangup()

;--- Ring an agent with the comm.voip.call id stamped on the INVITE ----------
; The ARI bridge originates  Local/<ext>@from-dialer-agent  with channel var
; __CALLID_HDR set to the comm.voip.call id, so the agent softphone can attach
; its recording to the right call (X-Voip-Call-Id header).
[from-dialer-agent]
exten => _X.,1,Dial(PJSIP/${EXTEN},30,b(from-dialer-agent^addhdr^1))
 same => n,Hangup()
exten => addhdr,1,Set(PJSIP_HEADER(add,X-Voip-Call-Id)=${CALLID_HDR})
 same => n,Return()
