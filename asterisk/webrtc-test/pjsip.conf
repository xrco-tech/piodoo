;=============================================================================
; pjsip.conf — WebRTC-only TEST config (no PSTN trunk).
; Two browser endpoints (1001 = the Odoo softphone, 1002 = the test dialer).
; TEST CREDENTIALS ARE HARD-CODED — do not use this file in production.
; ${EXTERNAL_IP} is substituted from .env by entrypoint.sh.
;=============================================================================

; Plain ws (8088) — this is what the Cloudflare tunnel delivers (edge terminates
; TLS, tunnel carries plain ws to host.docker.internal:8088). Needed or
; res_pjsip_transport_websocket rejects the ws connection ("no matching transport").
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}

; Secure ws (8089) — direct wss path (e.g. Tailscale), kept for completeness.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}

;--- 1001 : the Odoo agent softphone -----------------------------------------
; No transport= line: a registered WebRTC client uses whichever transport its
; connection arrived on (ws via the tunnel, or wss direct), for both in & out.
[1001]
type=endpoint
context=from-agents
disallow=all
allow=opus,ulaw,alaw
webrtc=yes                 ; enables DTLS-SRTP, ICE, rtcp-mux, AVPF in one shot
auth=1001
aors=1001

[1001]
type=auth
auth_type=userpass
username=1001
password=test1001secret

[1001]
type=aor
max_contacts=1
remove_existing=yes

;--- 1002 : the test dialer (dialer.html / a 2nd browser) --------------------
[1002]
type=endpoint
context=from-agents
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
auth=1002
aors=1002

[1002]
type=auth
auth_type=userpass
username=1002
password=test1002secret

[1002]
type=aor
max_contacts=1
remove_existing=yes
