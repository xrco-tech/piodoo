;=============================================================================
; pjsip.conf — WebRTC-only TEST config (no PSTN trunk).
; Two browser endpoints (1001 = the Odoo softphone, 1002 = the test dialer).
; TEST CREDENTIALS ARE HARD-CODED — do not use this file in production.
; ${EXTERNAL_IP} is substituted from .env by entrypoint.sh.
;=============================================================================

; Plain ws (8088) — this is what the Cloudflare tunnel delivers (edge terminates
; TLS, tunnel carries plain ws to host.docker.internal:8088). Needed or
; res_pjsip_transport_websocket rejects the ws connection ("no matching transport").
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}

; Secure ws (8089) — direct wss path (e.g. Tailscale), kept for completeness.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}

;--- 1001 : the Odoo agent softphone -----------------------------------------
; No transport= line: a registered WebRTC client uses whichever transport its
; connection arrived on (ws via the tunnel, or wss direct), for both in & out.
[1001]
type=endpoint
context=from-agents
disallow=all
allow=opus,ulaw,alaw
webrtc=yes                 ; enables DTLS-SRTP, ICE, rtcp-mux, AVPF in one shot
auth=1001
aors=1001

[1001]
type=auth
auth_type=userpass
username=1001
password=test1001secret

[1001]
type=aor
max_contacts=1
remove_existing=yes

;--- 1002 : the test dialer (dialer.html / a 2nd browser) --------------------
[1002]
type=endpoint
context=from-agents
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
auth=1002
aors=1002

[1002]
type=auth
auth_type=userpass
username=1002
password=test1002secret

[1002]
type=aor
max_contacts=1
remove_existing=yes

;=============================================================================
; VOX SIP TRUNK (PSTN) — registration auth, NAT-friendly.
; Rendered from .env by entrypoint.sh (${VOX_*}, ${EXTERNAL_IP}, ${LOCAL_NET}).
; Registrar bdl1.vphone.co.za:5060 (PBX). CLI/alias presented per dialplan.
;=============================================================================

; UDP transport for the trunk (SIP + RTP to Vox go over the internet, NOT the
; Cloudflare tunnel). external_*address = our public WAN IP so SDP advertises a
; routable media address; local_net keeps LAN/agent media un-NATed.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}
local_net=${LOCAL_NET}

[vox]
type=endpoint
context=from-vox
disallow=all
allow=${VOX_CODECS}
outbound_auth=vox_auth
aors=vox_aor
from_user=${VOX_USERNAME}
from_domain=${VOX_SIP_HOST}
direct_media=no
rtp_symmetric=yes          ; latch RTP to Vox's source — lets audio work behind NAT
force_rport=yes
rewrite_contact=yes

[vox_auth]
type=auth
auth_type=userpass
username=${VOX_USERNAME}
password=${VOX_SECRET}

[vox_aor]
type=aor
contact=sip:${VOX_SIP_HOST}:${VOX_SIP_PORT}
qualify_frequency=60

[vox_reg]
type=registration
outbound_auth=vox_auth
server_uri=sip:${VOX_SIP_HOST}:${VOX_SIP_PORT}
client_uri=sip:${VOX_USERNAME}@${VOX_SIP_HOST}
retry_interval=60
forbidden_retry_interval=300

; Identify inbound INVITEs from Vox as the [vox] endpoint (by registrar host).
; If inbound calls arrive from a different Vox media IP, add it to match=.
[vox_identify]
type=identify
endpoint=vox
match=${VOX_SIP_HOST}
