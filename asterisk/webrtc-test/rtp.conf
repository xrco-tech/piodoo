[general]
rtpstart = 10000
rtpend = 10200
icesupport = yes
; Asterisk is behind NAT with only private host candidates, so a remote browser
; can't reach its media directly. Point Asterisk at Cloudflare STUN/TURN so it
; gathers a PUBLICLY-reachable srflx + relay candidate (rendered from .env by
; entrypoint.sh). Creds are time-limited (Cloudflare) — refresh via cron.
stunaddr = ${STUN_ADDR}
turnaddr = ${TURN_HOST}
turnport = ${TURN_PORT}
turnusername = ${TURN_USER}
turnpassword = ${TURN_PASS}
