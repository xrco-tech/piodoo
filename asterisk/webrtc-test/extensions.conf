;=============================================================================
; extensions.conf — WebRTC test dialplan.
;   dial 1001 / 1002  -> ring that endpoint
;   dial 600          -> echo test (hear your own voice) — quickest audio check
;=============================================================================
[globals]

[from-agents]
exten => 1001,1,NoOp(call to agent softphone 1001)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,NoOp(call to test dialer 1002)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; Echo test — dial 600 from either endpoint to verify two-way audio.
exten => 600,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; ─── Outbound to the PSTN via the Vox trunk ─────────────────────────────────
; Present our Vox CLI/alias (${VOX_DID}) as caller ID. The dialled digits are
; passed through as-is; tighten the pattern/format once a live call confirms
; what Vox expects (national 0.. vs E.164 27..).
exten => _0[1-9]XXXXXXXX,1,NoOp(Vox outbound national: ${EXTEN})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/${EXTEN}@vox,60)
 same => n,Hangup()

exten => _27XXXXXXXXX,1,NoOp(Vox outbound E.164: ${EXTEN})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/${EXTEN}@vox,60)
 same => n,Hangup()

exten => _00.,1,NoOp(Vox outbound international: ${EXTEN})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/${EXTEN}@vox,60)
 same => n,Hangup()

; ─── Inbound from Vox ───────────────────────────────────────────────────────
; Ring the agent softphone. Catch-all on the called number since the DID may
; arrive as 27.., 0.., or bare digits.
[from-vox]
exten => _.,1,NoOp(Vox inbound to ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()
exten => s,1,NoOp(Vox inbound, no DID)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()
