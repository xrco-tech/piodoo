;=============================================================================
; extensions.conf — WebRTC test dialplan.
;   dial 1001 / 1002  -> ring that endpoint
;   dial 600          -> echo test (hear your own voice) — quickest audio check
;=============================================================================
[globals]

[from-agents]
exten => 1001,1,NoOp(call to agent softphone 1001)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,NoOp(call to test dialer 1002)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; Echo test — dial 600 from either endpoint to verify two-way audio.
exten => 600,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; Recording test — originate  Local/rec_<callid>@rec-test  application Echo
; Stamps the comm.voip.call id onto the INVITE to 1001 (the header the softphone
; reads) then bridges the agent to Echo, so you can validate record→upload→play.
[rec-test]
exten => _rec_X.,1,Set(__CALLID_HDR=${EXTEN:4})
 same => n,Dial(PJSIP/1001,30,b(rec-test^addhdr^1))
 same => n,Hangup()
exten => addhdr,1,Set(PJSIP_HEADER(add,X-Voip-Call-Id)=${CALLID_HDR})
 same => n,Return()
