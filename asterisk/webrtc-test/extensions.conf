;=============================================================================
; extensions.conf — WebRTC test dialplan.
;   dial 1001 / 1002  -> ring that endpoint
;   dial 600          -> echo test (hear your own voice) — quickest audio check
;=============================================================================
[globals]

[from-agents]
exten => 1001,1,NoOp(call to agent softphone 1001)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,NoOp(call to test dialer 1002)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; Echo test — dial 600 from either endpoint to verify two-way audio.
exten => 600,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()
