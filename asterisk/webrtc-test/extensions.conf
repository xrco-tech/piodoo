;=============================================================================
; extensions.conf — WebRTC test dialplan.
;   dial 1001 / 1002  -> ring that endpoint
;   dial 600          -> echo test (hear your own voice) — quickest audio check
;=============================================================================
[globals]

[from-agents]
exten => 1001,1,NoOp(call to agent softphone 1001)
 same => n,Dial(PJSIP/1001,90)
 same => n,Hangup()

exten => 1002,1,NoOp(call to test dialer 1002)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

exten => 1003,1,NoOp(call to Odoo 19 softphone 1003)
 same => n,Dial(PJSIP/1003,60)
 same => n,Hangup()

exten => 1004,1,NoOp(call to Odoo 20 softphone 1004)
 same => n,Dial(PJSIP/1004,60)
 same => n,Hangup()

; Echo test — dial 600 from either endpoint to verify two-way audio.
exten => 600,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; ─── Outbound to the PSTN via the Vox trunk ─────────────────────────────────
; Present our Vox CLI/alias (${VOX_DID}) as caller ID. Vox accepts SA numbers
; in national format (0..) — confirmed with a live call 2026-10-06 — and drops
; 27.. instantly, so every SA form is rewritten to 0.. before dialling.
; Contacts store numbers as +27.., which the softphone sends verbatim.
exten => _0[1-9]XXXXXXXX,1,NoOp(Vox outbound national: ${EXTEN})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/${EXTEN}@vox,60)
 same => n,Hangup()

exten => _27XXXXXXXXX,1,NoOp(Vox outbound 27.. -> national 0${EXTEN:2})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/0${EXTEN:2}@vox,60)
 same => n,Hangup()

exten => _+27XXXXXXXXX,1,NoOp(Vox outbound +27.. -> national 0${EXTEN:3})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/0${EXTEN:3}@vox,60)
 same => n,Hangup()

; Any other +<country code> number -> 00 international prefix.
exten => _+X.,1,NoOp(Vox outbound +intl -> 00${EXTEN:1})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/00${EXTEN:1}@vox,60)
 same => n,Hangup()

exten => _00.,1,NoOp(Vox outbound international: ${EXTEN})
 same => n,Set(CALLERID(num)=${VOX_DID})
 same => n,Dial(PJSIP/${EXTEN}@vox,60)
 same => n,Hangup()

; ─── Inbound from Vox ───────────────────────────────────────────────────────
; Ring the agent softphone. Catch-all on the called number since the DID may
; arrive as 27.., 0.., or bare digits.
[from-vox]
exten => _.,1,NoOp(Vox inbound to ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(PJSIP/1001&PJSIP/1003&PJSIP/1004,90)
 same => n,Hangup()
exten => s,1,NoOp(Vox inbound, no DID)
 same => n,Dial(PJSIP/1001&PJSIP/1003&PJSIP/1004,90)
 same => n,Hangup()
