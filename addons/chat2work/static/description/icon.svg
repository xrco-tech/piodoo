<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="256" height="256">
  <!-- Chat2Work: dots type in the chat bubble, then the briefcase hops. It
       moves where the menu shows this file; icon.png is the still frame. -->
  <style>
    .d1 { animation: d1 7s ease-in-out infinite; }
    .d2 { animation: d2 7s ease-in-out infinite; }
    .d3 { animation: d3 7s ease-in-out infinite; }
    .case { animation: hop 7s ease-in-out infinite; }
    @keyframes d1 { 0%, 6% { opacity: 0; } 11%, 48% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes d2 { 0%, 16% { opacity: 0; } 21%, 48% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes d3 { 0%, 26% { opacity: 0; } 31%, 48% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes hop { 0%, 60%, 70%, 80%, 100% { transform: translateY(0); } 65% { transform: translateY(-3.5px); } 75% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .d1, .d2, .d3, .case { animation: none; } }
  </style>
  <defs><clipPath id="c"><path d="M8 4h18a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H14l-6 7v-7a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6Z"/></clipPath></defs>
  <path d="M8 4h18a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H14l-6 7v-7a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6Z" fill="#FBB945"/>
  <circle class="d1" cx="10" cy="13" r="2.1" fill="#ffffff" opacity="0"/>
  <circle class="d2" cx="17" cy="13" r="2.1" fill="#ffffff" opacity="0"/>
  <circle class="d3" cx="24" cy="13" r="2.1" fill="#ffffff" opacity="0"/>
  <g class="case">
    <path d="M29 14h8a2 2 0 0 1 2 2v4h-3v-3h-6v3h-3v-4a2 2 0 0 1 2-2Z" fill="#F9464C"/>
    <rect x="18" y="20" width="30" height="24" rx="4" fill="#F9464C"/>
  </g>
  <g clip-path="url(#c)"><rect class="case" x="18" y="20" width="30" height="24" rx="4" fill="#F78613"/></g>
</svg>
